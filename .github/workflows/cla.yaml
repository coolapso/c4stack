name: CLA Assistant

on:
  issue_comment:
    types: [created]
  # pull_request_target runs this file as it is on main, with write access. Never add a
  # step that checks out or runs the pull request's code.
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla/signatures/v1/cla.json'
          path-to-document: 'https://github.com/coolapso/c4stack/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'coolapso,dependabot[bot],renovate[bot],github-actions[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thank you for contributing to C4Stack. Before this pull request can be merged, please read the CLA: $pathToCLADocument. If you agree, comment exactly: I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the C4Stack CLA.'
          lock-pullrequest-aftermerge: false
