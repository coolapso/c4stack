name: Checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # GitHub's runner provides Docker with Compose and Chrome; the steps below install
    # the rest. The job needs no secrets and publishes nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Static checks and generated code
        run: task check
      - name: Unit and integration tests
        run: task test:integration -- -race ./...
      - name: Generated starter app
        run: task test:app
      - name: Upgrade from one release to the next
        run: task test:upgrade
      - name: Example app, with browser tests
        run: task test:example
      - name: Build the generator
        run: task cli:build
