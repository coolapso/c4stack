name: Checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The self-hosted runner provides Go, Task 3.53.1 or later, Docker with Compose,
    # golangci-lint and Chromium. The job needs no secrets and publishes nothing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Static checks and generated code
        run: task check
      - name: Unit and integration tests
        run: task test:integration -- -race ./...
      - name: Generated starter app
        run: task test:app
      - name: Upgrade from one release to the next
        run: task test:upgrade
      - name: Example app, with browser tests
        run: task test:example
      - name: Build the generator
        run: task cli:build
