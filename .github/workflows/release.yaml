name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: semrel-release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install Task
        uses: arduino/setup-task@v3

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Install semrel
        run: go install github.com/SemRels/semrel/cmd/semrel@v0.26.2

      - name: Restore pinned Semrel provider
        run: semrel plugin restore

      - name: Configure disposable Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check, test and release
        run: task release:full
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
