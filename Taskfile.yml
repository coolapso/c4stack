# Tasks for developing C4Stack. Apps get their shared tasks from taskfiles/app.yml
# through their own Taskfile; this file reuses some of them.
version: '3'

vars:
  APP: c4stack
  ENV_PREFIX: C4STACK
  # A port of its own, so the framework's tests can run next to an app's.
  TEST_DB_PORT: '55433'
  TEST_DATABASE_URL: postgres://test:test-only@127.0.0.1:{{.TEST_DB_PORT}}/test?sslmode=disable

includes:
  app:
    taskfile: taskfiles/app.yml
    internal: true

tasks:
  templ:generate:
    desc: Generate Go code from the framework's Templ files (the example generates its own)
    cmds:
      - for f in $(git ls-files '*.templ' | grep -v '^examples/'); do go tool templ generate -f "$f" -log-level error; done

  # The framework's own check, rather than the shared one: the shared check generates
  # Templ code for the whole tree, which would rewrite the example module's files.
  check:
    desc: Vet, lint, and check formatting, module tidiness and generated code
    cmds:
      - go vet ./...
      - golangci-lint run --build-tags integration,apptest,upgrade ./...
      - |
        unformatted=$(gofmt -l . | grep -v '^examples/' || true)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"; echo "$unformatted"; exit 1
        fi
      - go tool templ fmt -fail .
      - go mod tidy -diff
      - |
        sums() { git ls-files '*_templ.go' | grep -v '^examples/' | xargs sha256sum; }
        before=$(sums)
        task templ:generate
        if [ "$before" != "$(sums)" ]; then
          echo "Generated Templ code was out of date and has been regenerated; commit it."; exit 1
        fi

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:integration:
    desc: Run unit and integration tests against a disposable PostgreSQL
    cmds:
      - task: app:test:integration
        vars: {CLI_ARGS: '{{.CLI_ARGS}}'}

  test:app:
    desc: Generate the starter app from this checkout, run its tasks and serve it end to end
    cmds:
      - defer: {task: app:test:db:down}
      - task: app:test:db:down
      - task: app:test:db:up
      - TEST_DATABASE_URL='{{.TEST_DATABASE_URL}}' go test -count=1 -tags apptest -run TestStarterApp ./internal/scaffold/

  test:upgrade:
    desc: Move a generated app from one release to the next with task framework:update
    cmds:
      - defer: {task: app:test:db:down}
      - task: app:test:db:down
      - task: app:test:db:up
      - TEST_DATABASE_URL='{{.TEST_DATABASE_URL}}' go test -count=1 -tags upgrade -run TestUpgrade ./internal/scaffold/

  test:example:
    desc: Check the example app, and run its integration and browser tests
    dir: examples/textlab
    cmds:
      - task check
      - task test:integration
      - task test:browser

  cli:build:
    desc: Build the generator into bin/c4stack
    cmds:
      - go build -o bin/c4stack ./cmd/c4stack

  release:verify:
    desc: 'Check that this commit can be released, for example: task release:verify VERSION=v0.1.0'
    requires:
      vars: [VERSION]
    cmds:
      - |
        echo "{{.VERSION}}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION must be a release such as v0.1.0."; exit 1; }
        [ -z "$(git status --porcelain)" ] || { echo "Commit or stash your changes first."; exit 1; }
        if git rev-parse -q --verify "refs/tags/{{.VERSION}}" >/dev/null; then
          echo "{{.VERSION}} is already tagged."; exit 1
        fi
        [ -f "docs/releases/{{.VERSION}}.md" ] || { echo "Write docs/releases/{{.VERSION}}.md first."; exit 1; }
      - task: check
      - task: test:integration
        vars: {CLI_ARGS: -race ./...}
      - task: test:app
      - task: test:upgrade
      - task: test:example
      - task: cli:build
      # Tagging and publishing are the owner's decision; this task does neither.
      - echo "{{.VERSION}} passed every check. Tag and publish it when you decide to."
