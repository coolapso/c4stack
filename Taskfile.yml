# Tasks for developing C4Stack. Apps get their shared tasks from taskfiles/app.yml
# through their own Taskfile; this file reuses some of them.
version: '3'

vars:
  APP: c4stack
  ENV_PREFIX: C4STACK
  # A port of its own, so the framework's tests can run next to an app's.
  TEST_DB_PORT: '55433'
  TEST_DATABASE_URL: postgres://test:test-only@127.0.0.1:{{.TEST_DB_PORT}}/test?sslmode=disable
  REPOSITORY: github.com/coolapso/c4stack
  # semrel (https://semrel.io) computes release versions; .semrel.yaml configures it.

includes:
  app:
    taskfile: taskfiles/app.yml
    internal: true

tasks:
  templ:generate:
    desc: Generate Go code from the framework's Templ files (the example generates its own)
    cmds:
      - for f in $(git ls-files '*.templ' | grep -v '^examples/'); do go tool templ generate -f "$f" -log-level error; done

  # The framework's own check, rather than the shared one: the shared check generates
  # Templ code for the whole tree, which would rewrite the example module's files.
  check:
    desc: Vet, lint, and check formatting, module tidiness and generated code
    cmds:
      - go vet ./...
      - golangci-lint run --build-tags integration,apptest,upgrade ./...
      - |
        unformatted=$(gofmt -l . | grep -v '^examples/' || true)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"; echo "$unformatted"; exit 1
        fi
      - go tool templ fmt -fail .
      - go mod tidy -diff
      - |
        sums() { git ls-files '*_templ.go' | grep -v '^examples/' | xargs sha256sum; }
        before=$(sums)
        task templ:generate
        if [ "$before" != "$(sums)" ]; then
          echo "Generated Templ code was out of date and has been regenerated; commit it."; exit 1
        fi

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:integration:
    desc: Run unit and integration tests against a disposable PostgreSQL
    cmds:
      - task: app:test:integration
        vars: {CLI_ARGS: '{{.CLI_ARGS}}'}

  test:app:
    desc: Generate the starter app from this checkout, run its tasks and serve it end to end
    cmds:
      - defer: {task: app:test:db:down}
      - task: app:test:db:down
      - task: app:test:db:up
      - TEST_DATABASE_URL='{{.TEST_DATABASE_URL}}' go test -count=1 -tags apptest -run TestStarterApp ./internal/scaffold/

  test:upgrade:
    desc: Move a generated app from one release to the next with task framework:update
    cmds:
      - defer: {task: app:test:db:down}
      - task: app:test:db:down
      - task: app:test:db:up
      - TEST_DATABASE_URL='{{.TEST_DATABASE_URL}}' go test -count=1 -tags upgrade -run TestUpgrade ./internal/scaffold/

  test:example:
    desc: Check the example app, and run its integration and browser tests
    dir: examples/textlab
    cmds:
      - task check
      - task test:integration
      - task test:browser

  # The maintainer's daily setup. The example gets the Creem test keys from the
  # Infisical project Searchbase Cloud's development tasks use, in its local
  # environment, as Searchbase's own app:serve does; nothing is kept in a
  # local file. Its other settings are in examples/textlab/Taskfile.yml, and sign-in
  # codes arrive in Mailpit at http://localhost:8025. Without access to that project,
  # give the example your own Creem test keys; see examples/textlab/README.md.
  serve:
    desc: Serve the example app with live reload on http://localhost:8082, with settings from Infisical
    dir: examples/textlab
    vars:
      INFISICAL_PROJECT_ID: 7b164ffd-8588-43f9-8c98-291204864d4d
      CREEM_API_KEY:
        sh: infisical secrets get --plain --silent --projectId {{.INFISICAL_PROJECT_ID}} --env local --path /creem API_KEY
      CREEM_WEBHOOK_SECRET:
        sh: infisical secrets get --plain --silent --projectId {{.INFISICAL_PROJECT_ID}} --env local --path /creem WEBHOOK_SECRET
    env:
      TEXTLAB_PUBLIC_URL: http://localhost:8082
      TEXTLAB_CREEM_PRODUCT_ID: prod_3XE2xgtVlwJ64ehEItnBo3
      # Textlab Pro, a test-mode recurring product: €5 a month.
      TEXTLAB_CREEM_PRO_PRODUCT_ID: prod_2E9COUD6qRZ8fJz5unI4Ff
      TEXTLAB_CREEM_API_KEY: '{{.CREEM_API_KEY}}'
      TEXTLAB_CREEM_WEBHOOK_SECRET: '{{.CREEM_WEBHOOK_SECRET}}'
    cmds:
      - task db:up mail:up
      # Stops the database and Mailpit when the server stops, including on Ctrl-C; the
      # database's data stays.
      - defer: task db:down
      - task db:migrate
      - task dev DEV_PORT=8082

  # task serve in a tmux window, as an app's task dev:tmux. The database and Mailpit
  # start first, so their panes follow the logs while task serve fetches its settings
  # and migrates. Ctrl+C in task serve's pane stops the example, the database and
  # Mailpit, which ends the log panes and closes the window. When task serve can't
  # start, such as when Infisical isn't logged in, its pane closes; run task serve on
  # its own to see why.
  dev:tmux:
    desc: Run task serve in a new tmux window, with the database's and Mailpit's logs
    dir: examples/textlab
    preconditions:
      - sh: '[ -n "$TMUX" ]'
        msg: Run task dev:tmux inside a tmux session.
    cmds:
      - task db:up mail:up
      - |
        app_pane=$(tmux new-window -d -P -F '#{pane_id}' -c '{{.TASKFILE_DIR}}' -n textlab "task serve")
        tmux split-window -d -t "$app_pane" -c "$PWD" "task db:logs"
        tmux split-window -d -t "$app_pane" -c "$PWD" "docker compose logs -f mailpit"
        tmux select-layout -t "$app_pane" tiled
        tmux select-pane -t "$app_pane"

  # A public address for Creem's webhooks while task serve runs: a Cloudflare quick
  # tunnel, which needs no account and gets a new address each time it starts (it
  # prints it). In Creem's test mode, Developers → Webhooks, point a webhook at
  # <address>/webhooks/subscriptions and one at <address>/webhooks/payments. Everything
  # the example serves is reachable there while the tunnel runs. The Host header becomes
  # localhost:8082, the only host the example answers for.
  tunnel:
    desc: Give the example app a public https address while task serve runs, for Creem's webhooks
    cmds:
      - cloudflared tunnel --no-autoupdate --url http://localhost:8082 --http-host-header localhost:8082

  # The example's development database, the one task serve uses. db:connect starts it
  # when it isn't running and stops it again when psql exits; db:wipe deletes it, and
  # the next task serve migrates a new, empty one.
  db:connect:
    desc: Open psql on the example app's development database
    dir: examples/textlab
    interactive: true
    vars:
      STOPPED:
        sh: docker compose ps -q --status running postgres | grep -q . || echo yes
    cmds:
      - '{{if .STOPPED}}task db:up{{end}}'
      - defer: '{{if .STOPPED}}docker compose stop postgres{{end}}'
      - task db:connect

  db:wipe:
    desc: Delete the example app's development database and all its data
    dir: examples/textlab
    prompt: This deletes the example app's development database and all its data. Continue?
    cmds:
      - task --yes db:wipe

  cli:build:
    desc: Build the generator into bin/c4stack
    cmds:
      - go build -o bin/c4stack ./cmd/c4stack

  release:next:
    desc: Show the version the commits since the last release would get
    cmds:
      - 'semrel release --dry-run --no-color'

  # Searchbase's release:gh, with semrel in place of go-semantic-release.
  release:gh:
    desc: Release the current branch on GitHub with semrel
    cmds:
      - |
        export REPOSITORY="{{.REPOSITORY}}"
        # semrel's GitHub plugin reads the repository from it.
        export GITHUB_REPOSITORY="${REPOSITORY#github.com/}"
        git pull origin $(git branch --show-current) --rebase
        git push origin $(git branch --show-current)
        if [ -z "$GITHUB_TOKEN" ]; then
          echo "GITHUB_TOKEN is not set, using gh cli"
          export GITHUB_TOKEN=$(gh auth token)
        fi
        # semrel tags locally first, which needs a committer, as in a CI checkout.
        git config user.name >/dev/null || git config user.name "github-actions[bot]"
        git config user.email >/dev/null || git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Install the plugin pinned in .semrel.lock. A plugin missing at release time is
        # skipped with a warning rather than failing the release.
        semrel plugin restore
        out=$(mktemp)
        trap 'rm -f "$out"' EXIT
        semrel release --no-color --output-file "$out"
        # Read single lines only: the file also holds the multi-line changelog.
        tag=$(sed -n 's/^TAG=//p' "$out")
        if [ "$(sed -n 's/^RELEASED=//p' "$out")" = true ] && [ -n "$tag" ]; then
          gh release view "$tag" >/dev/null || { echo "semrel tagged $tag, but no GitHub release was published."; exit 1; }
          # GitHub created the published tag; replace semrel's local one with it.
          git fetch origin --tags --force
        fi

  release:full:
    desc: Run every check, then release on GitHub
    cmds:
      - task: check
      - task: test:integration
        vars: {CLI_ARGS: -race ./...}
      - task: test:app
      - task: test:upgrade
      - task: test:example
      - task: cli:build
      - task: release:gh
