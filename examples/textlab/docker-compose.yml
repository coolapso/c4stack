# The local development services. task db:up starts the database, task db:wipe deletes
# its data. task mail:up starts Mailpit, which catches Textlab's emails.
name: textlab

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: textlab
      POSTGRES_PASSWORD: textlab
      POSTGRES_DB: textlab
    ports:
      - 127.0.0.1:${DB_PORT:-5433}:5432
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, textlab, -d, textlab]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email Textlab sends, such as sign-in codes. Its inbox is
  # http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025

volumes:
  postgres:
