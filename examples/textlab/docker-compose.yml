# The local development database. task db:up starts it, task db:wipe deletes its data.
name: textlab

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: textlab
      POSTGRES_PASSWORD: textlab
      POSTGRES_DB: textlab
    ports:
      - 127.0.0.1:${DB_PORT:-5433}:5432
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, textlab, -d, textlab]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
