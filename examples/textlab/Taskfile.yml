# Textlab's tasks. The shared tasks come from this checkout's taskfiles/app.yml; a real
# app includes them from the release in its go.mod (see the generator's Taskfile).
version: '3'

vars:
  APP: textlab
  ENV_PREFIX: TEXTLAB
  IMAGE: textlab
  FRAMEWORK_VERSION: v0.0.0
  DB_PORT: '5433'
  TEST_DB_PORT: '55434'
  TEST_DATABASE_URL: postgres://test:test-only@127.0.0.1:{{.TEST_DB_PORT}}/test?sslmode=disable

dotenv: ['.env']

includes:
  shared:
    taskfile: ../../taskfiles/app.yml
    flatten: true
    excludes: []

tasks:
  test:browser:
    desc: Drive the pages in headless Chromium against a disposable database
    cmds:
      - defer: {task: test:db:down}
      - task: test:db:down
      - task: test:db:up
      - TEST_DATABASE_URL='{{.TEST_DATABASE_URL}}' go test -count=1 -tags browser ./...
