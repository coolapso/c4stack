# Textlab's tasks. The shared tasks come from this checkout's taskfiles/app.yml; a real
# app includes them from the release in its go.mod (see the generator's Taskfile).
version: '3'

vars:
  APP: textlab
  ENV_PREFIX: TEXTLAB
  IMAGE: textlab
  FRAMEWORK_VERSION: v0.0.0
  DB_PORT: '5433'
  TEST_DB_PORT: '55434'
  TEST_DATABASE_URL: postgres://test:test-only@127.0.0.1:{{.TEST_DB_PORT}}/test?sslmode=disable
  # The Creem test keys come from the maintainer's Infisical project, unless your shell
  # gives TEXTLAB_CREEM_API_KEY: then your shell gives them all; see README.md.
  INFISICAL_PROJECT: '{{if not .TEXTLAB_CREEM_API_KEY}}2a2ed45b-5eab-4fa2-bd60-bccd6638f7d0{{end}}'
  INFISICAL_SECRETS:
    map:
      TEXTLAB_CREEM_API_KEY: /creem/API_KEY
      TEXTLAB_CREEM_WEBHOOK_SECRET: /creem/WEBHOOK_SECRET
      TEXTLAB_CREEM_SUBSCRIPTION_WEBHOOK_SECRET: /creem/SUBSCRIPTION_WEBHOOK_SECRET

# The settings task dev, task run and task db:migrate give Textlab, besides the Creem
# keys above. None is a secret: the secret key is a new one each time a task starts.
# Variables in your shell win over these. Never keep settings in a .env file.
env:
  TEXTLAB_PUBLIC_URL: http://localhost:8080
  TEXTLAB_DATABASE_URL: postgres://textlab:textlab@localhost:5433/textlab?sslmode=disable
  # Mailpit, from docker-compose.yml (task mail:up): http://localhost:8025.
  TEXTLAB_SMTP_URL: smtp://localhost:1025
  TEXTLAB_EMAIL_FROM: noreply@localhost
  # Products in the maintainer's Creem test store: credit, bought at a custom price,
  # and Textlab Pro, a recurring product at €5 a month.
  TEXTLAB_CREEM_PRODUCT_ID: prod_6yflEb2Z5ZU8EucvqBdPjK
  TEXTLAB_CREEM_PRO_PRODUCT_ID: prod_1lMWPp6vmcA6cpAGAJ8hNB
  TEXTLAB_LOG_FORMAT: text
  TEXTLAB_LOG_LEVEL: debug
  TEXTLAB_SECRET_KEY:
    sh: openssl rand -hex 32

includes:
  shared:
    taskfile: ../../taskfiles/app.yml
    flatten: true
    excludes: []

tasks:
  test:browser:
    desc: Drive the pages in headless Chromium against a disposable database
    cmds:
      - defer: {task: test:db:down}
      - task: test:db:down
      - task: test:db:up
      - TEST_DATABASE_URL='{{.TEST_DATABASE_URL}}' go test -count=1 -tags browser ./...
