# Shared tasks for C4Stack apps.
#
# An app's Taskfile.yml includes this file at the C4Stack release in its go.mod, so
# fixed and new tasks arrive when the app updates the framework. Every task runs from
# the app's root directory: the tasks set no `dir`, so Task runs them where the app's
# Taskfile is, or where a parent Taskfile's include of the app points (`dir: ./app`).
#
# The app's Taskfile sets:
#   APP           the app's name: binary, Compose project and database name
#   ENV_PREFIX    the prefix of the app's environment variables, such as ACME
#   IMAGE         the container image name
# and can set:
#   REGISTRY      where container:push pushes, such as ghcr.io/you
#   PLATFORMS     container:push platforms (default linux/amd64,linux/arm64)
#   DB_PORT       the local database's port (default 5432)
#   DEV_PORT      the port task dev serves on (default 8080); the app itself listens
#                 on DEV_APP_PORT (default 8081) behind the live-reload proxy
#   TEST_DB_PORT  the disposable test database's port (default 55432)
#   INFISICAL_PROJECT and INFISICAL_ENV
#                 give dev, run and db:migrate the secrets of that Infisical project's
#                 environment (default dev): with `infisical run`, the root folder's,
#                 named as the app reads them
#   INFISICAL_SECRETS
#                 with INFISICAL_PROJECT, the secrets to give them instead, by the
#                 app's name and their path in the project, as production's secret
#                 store maps them:
#                   INFISICAL_SECRETS:
#                     map:
#                       ACME_CREEM_API_KEY: /creem/API_KEY
#                 Each is fetched when the task starts and reaches the app in its
#                 environment only, never in a command's arguments; one that can't be
#                 fetched is left out, and Infisical's error says why.
#
# To change a shared task, add its name to `excludes` in the app's include and define
# a task with the same name in the app's Taskfile.

version: '3'

# The shared tasks' own variables start with SHARED_. Task merges an included file's
# variables over the app's, so they must never share a name with an app variable.
vars:
  SHARED_BINARY: bin/{{.APP}}
  SHARED_DB_PORT: '{{.DB_PORT | default "5432"}}'
  SHARED_DEV_PORT: '{{.DEV_PORT | default "8080"}}'
  SHARED_DEV_APP_PORT: '{{.DEV_APP_PORT | default "8081"}}'
  SHARED_TEST_DB_PORT: '{{.TEST_DB_PORT | default "55432"}}'
  SHARED_TEST_DATABASE_URL: postgres://test:test-only@127.0.0.1:{{.SHARED_TEST_DB_PORT}}/test?sslmode=disable
  SHARED_PLATFORMS: '{{.PLATFORMS | default "linux/amd64,linux/arm64"}}'
  # A prefix for the app's commands: assignments that fetch INFISICAL_SECRETS, or
  # `infisical run`.
  SHARED_SECRETS: >-
    {{if .INFISICAL_PROJECT}}{{if .INFISICAL_SECRETS}}{{range $name, $path := .INFISICAL_SECRETS}}{{$name}}="$(infisical secrets get {{base $path}} --path={{dir $path}} --plain --silent --projectId={{$.INFISICAL_PROJECT}} --env={{$.INFISICAL_ENV | default "dev"}})" {{end}}{{else}}infisical run --projectId={{.INFISICAL_PROJECT}} --env={{.INFISICAL_ENV | default "dev"}} --{{end}}{{end}}
  SHARED_STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.8.2
  SHARED_TAG:
    sh: (git describe --tags --always --dirty=-dev 2>/dev/null || echo dev) | sed 's/^v//'
  # The disposable test database. Its data lives in memory and disappears with it.
  SHARED_TEST_COMPOSE: |
    services:
      postgres:
        image: postgres:18-alpine
        environment:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: test
        ports:
          - 127.0.0.1:{{.SHARED_TEST_DB_PORT}}:5432
        tmpfs:
          - /var/lib/postgresql
        healthcheck:
          test: [CMD, pg_isready, -U, test, -d, test]
          interval: 1s
          timeout: 3s
          retries: 30

tasks:
  # Develop -------------------------------------------------------------------

  dev:
    desc: Serve the app with live reload on http://localhost:{{.SHARED_DEV_PORT}}
    cmds:
      - go tool templ generate
      - >-
        {{.ENV_PREFIX}}_ADDR=127.0.0.1:{{.SHARED_DEV_APP_PORT}} {{.SHARED_SECRETS}}
        go tool templ generate --watch
        --proxy=http://127.0.0.1:{{.SHARED_DEV_APP_PORT}} --proxybind=127.0.0.1 --proxyport={{.SHARED_DEV_PORT}}
        --open-browser=false
        --watch-pattern='(.+\.go$)|(.+\.templ$)|(.+\.css$)|(.+\.js$)|(.+\.sql$)'
        --cmd='go run . serve'

  # Searchbase Cloud's dev:tmux, on the shared tasks. The containers start first, in the
  # background, so their panes follow the logs. Ctrl+C in each pane stops it and closes
  # the window; the containers keep running (task db:down mail:down stops them).
  # Closing the window instead leaves the app running, as Searchbase's does: tmux hangs
  # up only each pane's first process, and Task waits for its commands. Apps without
  # Mailpit (on Hanko) get no Mailpit pane.
  dev:tmux:
    desc: Start the database and Mailpit, then open the app (migrated first) and their logs in a new tmux window
    preconditions:
      - sh: '[ -n "$TMUX" ]'
        msg: Run task dev:tmux inside a tmux session.
    cmds:
      - task: db:up
      - |
        mail=$(docker compose config --services | grep -x mailpit || true)
        if [ -n "$mail" ]; then task mail:up; fi
        app_pane=$(tmux new-window -d -P -F '#{pane_id}' -c "$PWD" -n {{.APP}} "task db:migrate dev")
        tmux split-window -d -t "$app_pane" -c "$PWD" "task db:logs"
        if [ -n "$mail" ]; then
          tmux split-window -d -t "$app_pane" -c "$PWD" "docker compose logs -f mailpit"
        fi
        tmux select-layout -t "$app_pane" tiled
        tmux select-pane -t "$app_pane"

  templ:generate:
    desc: Generate Go code from Templ files
    cmds:
      - go tool templ generate

  templ:watch:
    desc: Regenerate Go code whenever a Templ file changes
    cmds:
      - go tool templ generate --watch

  run:
    desc: 'Run an app command, for example: task run -- migrate status'
    cmds:
      - '{{.SHARED_SECRETS}} go run . {{.CLI_ARGS}}'

  # Local database --------------------------------------------------------------

  db:up:
    desc: Start the local development database
    env:
      DB_PORT: '{{.SHARED_DB_PORT}}'
    cmds:
      - docker compose up -d --wait postgres

  db:down:
    desc: Stop the local development database and keep its data
    env:
      DB_PORT: '{{.SHARED_DB_PORT}}'
    cmds:
      - docker compose down

  db:logs:
    desc: Follow the local database's logs
    env:
      DB_PORT: '{{.SHARED_DB_PORT}}'
    cmds:
      - docker compose logs -f postgres

  db:connect:
    desc: Open psql on the local database
    interactive: true
    env:
      DB_PORT: '{{.SHARED_DB_PORT}}'
    cmds:
      - docker compose exec postgres psql -U {{.APP}} {{.APP}}

  db:wipe:
    desc: Delete the local database and all its data
    prompt: This deletes the local {{.APP}} database and all its data. Continue?
    env:
      DB_PORT: '{{.SHARED_DB_PORT}}'
    cmds:
      - docker compose down --volumes

  db:migrate:
    desc: Apply pending migrations to the database in {{.ENV_PREFIX}}_DATABASE_URL
    cmds:
      - '{{.SHARED_SECRETS}} go run . migrate'

  # Local mail ----------------------------------------------------------------

  mail:up:
    desc: Start Mailpit, which catches the app's emails; its inbox is http://localhost:8025
    env:
      DB_PORT: '{{.SHARED_DB_PORT}}'
    cmds:
      - docker compose up -d --wait mailpit

  mail:down:
    desc: Stop Mailpit
    env:
      DB_PORT: '{{.SHARED_DB_PORT}}'
    cmds:
      - docker compose stop mailpit

  # Quality -------------------------------------------------------------------

  test:
    desc: Run unit tests
    cmds:
      - go test {{.CLI_ARGS | default "./..."}}

  test:integration:
    desc: Run unit and integration tests against a disposable PostgreSQL
    cmds:
      - defer: {task: test:db:down}
      - task: test:db:down
      - task: test:db:up
      - >-
        {{.ENV_PREFIX}}_DATABASE_URL='{{.SHARED_TEST_DATABASE_URL}}' TEST_DATABASE_URL='{{.SHARED_TEST_DATABASE_URL}}'
        go test -count=1 -tags integration {{.CLI_ARGS | default "./..."}}

  test:db:up:
    desc: Start the disposable test database (task test:integration does this)
    cmds:
      - |
        cat <<'EOF' | docker compose -p {{.APP}}-test -f - up -d --wait --wait-timeout 60
        {{.SHARED_TEST_COMPOSE}}
        EOF

  test:db:down:
    desc: Remove the disposable test database
    cmds:
      - |
        cat <<'EOF' | docker compose -p {{.APP}}-test -f - down --volumes --remove-orphans
        {{.SHARED_TEST_COMPOSE}}
        EOF

  check:
    desc: Vet, lint, and check formatting, module tidiness and generated code
    cmds:
      - |
        required=$(go list -m -f '{{"{{"}}.Version{{"}}"}}' github.com/coolapso/c4stack 2>/dev/null || true)
        if [ "$required" != "{{.FRAMEWORK_VERSION}}" ]; then
          echo "Taskfile.yml includes the shared tasks of {{.FRAMEWORK_VERSION}}, but go.mod requires C4Stack $required."
          echo "Run: task framework:update VERSION=$required"; exit 1
        fi
      - go vet ./...
      - go run {{.SHARED_STATICCHECK}} ./...
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"; echo "$unformatted"; exit 1
        fi
      - go tool templ fmt -fail .
      - go mod tidy -diff
      - |
        before=$(find . -name '*_templ.go' -not -path './.task/*' -exec sha256sum {} + | sort)
        go tool templ generate -log-level error
        after=$(find . -name '*_templ.go' -not -path './.task/*' -exec sha256sum {} + | sort)
        if [ "$before" != "$after" ]; then
          echo "Generated Templ code was out of date and has been regenerated; commit it."; exit 1
        fi

  # Build ---------------------------------------------------------------------

  build:
    desc: Build the app's binary into {{.SHARED_BINARY}}
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o {{.SHARED_BINARY}} .

  container:binaries:
    internal: true
    cmds:
      - for: {var: TARGETS, split: ','}
        cmd: >-
          CGO_ENABLED=0 GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}}
          go build -trimpath -ldflags='-s -w' -o bin/{{.APP}}-{{splitList "/" .ITEM | first}}-{{splitList "/" .ITEM | last}} .

  container:build:
    desc: Build the container image for this machine, tagged from git describe
    vars:
      LOCAL_PLATFORM: linux/{{ARCH}}
    cmds:
      - task: container:binaries
        vars: {TARGETS: '{{.LOCAL_PLATFORM}}'}
      - docker buildx build --platform {{.LOCAL_PLATFORM}} -f Containerfile -t {{.IMAGE}}:{{.SHARED_TAG}} --load .

  container:push:
    desc: Build the image for PLATFORMS and push it to REGISTRY, tagged from git describe and latest
    requires:
      vars: [REGISTRY]
    cmds:
      - task: container:binaries
        vars: {TARGETS: '{{.SHARED_PLATFORMS}}'}
      - >-
        docker buildx build --platform {{.SHARED_PLATFORMS}} -f Containerfile
        -t {{.REGISTRY}}/{{.IMAGE}}:{{.SHARED_TAG}} -t {{.REGISTRY}}/{{.IMAGE}}:latest --push .

  # Framework -----------------------------------------------------------------

  framework:update:
    desc: 'Move to another C4Stack release, for example: task framework:update VERSION=v0.3.0 (or 0.3.0)'
    requires:
      vars: [VERSION]
    vars:
      # Releases are tagged vX.Y.Z; a version without the v gets it, so 0.3.0 pins
      # v0.3.0 rather than a ref that doesn't exist.
      SHARED_VERSION: v{{trimPrefix "v" .VERSION}}
    cmds:
      - go get github.com/coolapso/c4stack@{{.SHARED_VERSION}}
      - go mod tidy
      # Pin the shared tasks to the same release.
      - |
        tmp=$(mktemp)
        awk -v version='{{.SHARED_VERSION}}' '/^  FRAMEWORK_VERSION: / { print "  FRAMEWORK_VERSION: " version; next } { print }' Taskfile.yml > "$tmp"
        cat "$tmp" > Taskfile.yml && rm "$tmp"
      # A new task process includes the shared tasks of the new release.
      - task templ:generate
      - task test
      - task build
